<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedNotes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123A44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8EFEE;--surface:#FFFFFF;--sunk:#F2F6F5;--ink:#122A31;--muted:#53676D;--line:#D0DCDA;
  --accent:#0D6B67;--accent-soft:#D5EBE9;--on-accent:#FFFFFF;--danger:#B3261E;
  --up:#9A4A07;--down:#1F5FA8;--new:#5B3FA0;--band:#123A44;--band-ink:#EEF6F5;
  --pr-alta:#C2362B;--pr-media:#C08A12;--pr-baja:#5E8C6A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B161A;--surface:#13222A;--sunk:#0F1C21;--ink:#E2ECEB;--muted:#93A7AC;--line:#24383F;
    --accent:#52BBB3;--accent-soft:#163A3C;--on-accent:#04201E;--danger:#F2867D;
    --up:#F0A35E;--down:#82B4F2;--new:#BBA6F2;--band:#0B2C33;--band-ink:#E2F1EF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B161A;--surface:#13222A;--sunk:#0F1C21;--ink:#E2ECEB;--muted:#93A7AC;--line:#24383F;
  --accent:#52BBB3;--accent-soft:#163A3C;--on-accent:#04201E;--danger:#F2867D;
  --up:#F0A35E;--down:#82B4F2;--new:#BBA6F2;--band:#0B2C33;--band-ink:#E2F1EF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:760px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 0 8px}
.top h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
.sp{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;color:var(--muted)}
.icon-btn[aria-pressed="true"]{color:var(--pr-media)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:7px 0 8px;font-size:.74rem;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (min-width:900px){
  .tabs{top:0;right:auto;width:92px;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 6px 14px}
  .tabs button{flex:0;padding:12px 0}
  .app{padding-left:108px;padding-bottom:48px;max-width:900px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;font-size:.92rem}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.row-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:.9rem;color:var(--muted);font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:2px 0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--ink);min-width:0}

/* Hero: la pulsera de la próxima guardia */
.hero{background:var(--band);color:var(--band-ink);border-radius:20px;padding:18px 20px 20px;margin:0 0 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:34%;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.06) 9px 11px);pointer-events:none}
.hero p{margin:0;position:relative;z-index:1}
.hero-k{font-size:.92rem;opacity:.82}
.hero-big{margin:2px 0 6px!important;font-size:clamp(1.9rem,8vw,2.7rem);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.hero-s{font-size:.98rem}
.hero .dim{opacity:.72;margin-top:2px}
.hero .btn{margin-top:14px;background:var(--band-ink);color:var(--band);border:0;position:relative;z-index:1}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:700;color:var(--ink);text-align:center}
.quick button svg{color:var(--accent)}

.sec{margin:0 0 20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:1.08rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 10px}
.empty p:last-child{margin:0}

/* Pacientes */
.plist{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.plist{grid-template-columns:1fr 1fr}}
.pcard{display:flex;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0;overflow:hidden;width:100%}
.band{flex:none;width:68px;background:var(--band);color:var(--band-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px}
.band small{font-size:.72rem;opacity:.8}
.band b{font-size:1.6rem;line-height:1.05;letter-spacing:-.02em}
.band.big{width:84px;border-radius:14px;padding:14px 4px}
.band.big b{font-size:2rem}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.strong{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dx{color:var(--ink);font-size:.93rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{color:var(--muted);font-size:.84rem}
.alg{color:var(--danger);font-size:.82rem;font-weight:700}
.bedstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bedchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;min-width:112px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.bedchip b{font-size:1.3rem;line-height:1.1}
.bedchip span{font-size:.85rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bedchip small{color:var(--accent);font-weight:700}

.pt-head{display:flex;gap:14px;align-items:stretch;margin:4px 0 10px}
.pt-head h2{margin:2px 0 4px;font-size:1.25rem}
.pt-head p{margin:0 0 4px}
.allergy-bar{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);border-radius:12px;padding:8px 12px;font-weight:700;margin:0 0 12px;font-size:.92rem}

.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 14px;font-weight:700;cursor:pointer;min-height:52px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary span:first-child{flex:1}
.acc>summary svg{transition:transform .2s;color:var(--muted)}
.acc[open]>summary svg{transform:rotate(90deg)}
.count{font-size:.78rem;background:var(--sunk);border-radius:999px;padding:1px 8px;color:var(--muted)}
.acc-b{padding:0 14px 14px}
dl.kv{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:6px 12px;margin:0 0 10px;font-size:.94rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;white-space:pre-wrap}

.evo{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--sunk)}
.evo header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.evo header b{font-size:1.05rem;margin-right:8px}
.acts{display:flex;gap:2px}
.vit{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vit span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.vit b{font-weight:700}
.soap{margin:6px 0 0;font-size:.93rem}
.soap h4{margin:8px 0 2px;font-size:.82rem;color:var(--muted)}
.soap p{margin:0;white-space:pre-wrap}
.pager{display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:10px}
.pager .icon-btn:disabled{opacity:.3}
.pg-mid{flex:1;text-align:center;display:flex;flex-direction:column}
.pg-days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.pg-days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700}
.pg-days button[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.swipe{touch-action:pan-y}
.swipe .evo{background:var(--surface)}
.ed-body img{max-width:100%;height:auto;border-radius:12px;display:block;margin:10px 0}
.ed-body img.sz-s{width:35%}
.ed-body img.sz-m{width:60%}
.ed-body img.sz-l{width:85%}
.ed-body img.sel{outline:3px solid var(--accent);outline-offset:2px}
.imgbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;gap:2px;background:var(--ink);color:var(--bg);padding:6px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 24px);overflow-x:auto}
.imgbar button{border:0;background:none;color:inherit;padding:9px 11px;border-radius:10px;font-size:.88rem;font-weight:700;white-space:nowrap}
.imgbar button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.lockbar{background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.busy{position:fixed;inset:0;z-index:70;background:rgba(5,15,18,.55);display:grid;place-items:center;padding:24px}
.busy>div{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;max-width:340px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rots{display:grid;gap:10px}
@media (min-width:640px){.rots{grid-template-columns:1fr 1fr}}
.rot{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ink)}
.rot.done{opacity:.7}
.rico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;flex:none;letter-spacing:.02em}
.rtx{display:flex;flex-direction:column;gap:1px;min-width:0}
.rtx b{font-size:1.05rem}
.rtx span{font-size:.86rem;color:var(--muted)}
.rtx .rst{align-self:flex-start;margin-top:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.rtx .rst.on{background:color-mix(in srgb,var(--k-guardia) 16%,var(--surface));color:var(--k-guardia)}
.rtx .rst.now{background:var(--k-guardia);color:#fff}
.csw{display:flex;gap:10px;margin:0 0 14px}
.csw label{position:relative}
.csw input{position:absolute;opacity:0;width:1px;height:1px}
.csw span{display:block;width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.csw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.csw input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.condpick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.condpick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:700;color:var(--ink)}
.condpick i{width:12px;height:12px;border-radius:50%;background:var(--cc);border:1px solid var(--line)}
.condpick button[aria-pressed="true"]{border-color:var(--cc);box-shadow:inset 0 0 0 2px var(--cc)}
.kc .kl{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:.95rem;width:auto;height:auto}
.band{box-shadow:inset -1px 0 0 rgba(127,127,127,.25)}
.dxrow{display:grid;grid-template-columns:118px 1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.dxrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:1rem}
.copied{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem;margin:0 0 12px}
.menu button small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.exr{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
.exr>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;font-weight:700;color:var(--ink);cursor:pointer;min-height:48px}
.exr>summary::-webkit-details-marker{display:none}
.exr>summary span:first-child{flex:1}
.exr>summary svg{transition:transform .2s;color:var(--muted)}
.exr[open]>summary svg{transform:rotate(90deg)}
.exr-b{padding:0 12px 12px}
.exm{margin-bottom:12px}
.exm-h{font-size:.86rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.exc{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 11px;font-size:.84rem;color:var(--ink);text-align:left;font-weight:400}
.exc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.exm textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:.98rem;resize:vertical;font-weight:400}
.exc-t{font-weight:700;font-size:.88rem;margin:12px 0 4px}

.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.88rem;background:var(--sunk)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.cmp{border-collapse:collapse;width:100%;font-size:.9rem;min-width:320px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cmp thead th{font-size:.85rem;white-space:nowrap}
table.cmp th small,table.cmp td small{display:block;font-size:.74rem;color:var(--muted);font-weight:400}
table.cmp tr.grp th{background:var(--sunk);font-size:.8rem;color:var(--muted)}
td.d-up small{color:var(--up);font-weight:700}
td.d-down small{color:var(--down);font-weight:700}
td.d-new small{color:var(--new);font-weight:700}
td.d-gone{color:var(--muted);font-style:italic}
td.d-chg small{color:var(--new);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:10px 0}
.legend b.up{color:var(--up)}.legend b.down{color:var(--down)}.legend b.new{color:var(--new)}
.tcols{display:grid;grid-template-columns:repeat(var(--n),minmax(170px,1fr));gap:8px}
.tcol{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem}
.tcol p{margin:2px 0 0;white-space:pre-wrap}
.tday{font-weight:700;font-size:.8rem;color:var(--muted)}
.same{color:var(--muted);font-style:italic}
h4.th{margin:14px 0 6px;font-size:.92rem}
.note-honest{font-size:.82rem;color:var(--muted);margin:8px 0 0}

.li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:.86rem;color:var(--muted);white-space:pre-wrap}
.off{opacity:.55}

/* Calendario */
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 10px 12px;margin-bottom:12px}
.cal-head{display:flex;align-items:center;gap:2px;padding:0 4px 12px}
.cal-head h2{flex:1;margin:0;font-size:1.3rem;letter-spacing:-.01em}
.cal-head h2 span{color:var(--muted);font-weight:400}
.mini-seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;margin-right:6px}
.mini-seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:700;color:var(--muted)}
.mini-seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.wd{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700;padding:0 0 8px}
.day{position:relative;height:54px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:4px 0 0;min-width:0;color:var(--ink)}
.day:hover{background:var(--sunk)}
.day.pad{pointer-events:none}
.day .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.day.past .n{color:var(--muted);font-weight:400}
.day.g .n{background:var(--k-guardia);color:#fff;font-weight:700}
.day.g.past .n{opacity:.5}
.day.today .n{box-shadow:0 0 0 2px var(--accent)}
.day.today.g .n{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--k-guardia)}
.dots{display:flex;gap:3px;margin-top:4px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.dots i.nd{background:var(--muted)}
.dots i.rc{background:var(--accent)}
.klegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 6px 0;margin-top:8px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.klegend span{display:inline-flex;align-items:center;gap:6px}
.klegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cal-bar{display:flex;align-items:center;gap:8px;margin:0 0 18px}
.cal-bar .stat{flex:1;font-size:.9rem;color:var(--muted)}
.cal-bar .stat b{color:var(--ink);font-size:1.1rem}
.nextg{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.nextg button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;text-align:left;color:var(--ink)}
.nextg button:last-child{border-bottom:0}
.nextg .dd{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--k-guardia) 15%,var(--surface));color:var(--k-guardia);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.nextg .dd b{font-size:1.05rem}
.nextg .dd small{font-size:.66rem;margin-top:2px}
.nextg .tx{flex:1;min-width:0}
.nextg .tx b{display:block;font-size:.95rem}
.nextg .tx span{font-size:.82rem;color:var(--muted)}
.nextg .in{font-size:.8rem;color:var(--muted);white-space:nowrap}
.wrow{display:flex;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;color:var(--ink)}
.wrow:last-of-type{border-bottom:0}
.wrow .wd2{flex:none;width:44px;text-align:center}
.wrow .wd2 small{color:var(--muted);font-size:.72rem}
.wrow .wd2 b{display:grid;place-items:center;width:34px;height:34px;margin:2px auto 0;border-radius:50%;font-size:1rem}
.wrow.g .wd2 b{background:var(--k-guardia);color:#fff}
.wrow.today .wd2 b{box-shadow:0 0 0 2px var(--accent)}
.gt{color:var(--k-guardia);font-weight:700;font-size:.9rem}
@media (min-width:700px){.day{height:62px}.day .n{width:38px;height:38px}}
.gtag{display:inline-block;background:var(--k-guardia);color:#fff;font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:8px}
.status{border-radius:14px;padding:12px 14px;font-weight:700;margin:8px 0 10px}
.status small{display:block;font-weight:400;opacity:.85}
.status.g{background:var(--k-guardia);color:#fff}
.status.free{background:color-mix(in srgb,var(--k-libre) 14%,var(--surface));color:var(--ink)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev i{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.strip span{border-radius:8px;text-align:center;padding:6px 0;font-size:.78rem;border:1px solid var(--line);background:var(--surface)}
.strip span b{display:block;font-size:.95rem}
.strip span.g{background:var(--k-guardia);color:#fff;border-color:var(--k-guardia)}

/* Recordatorios */
.rem{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pr-media);border-radius:12px;padding:6px 6px 6px 10px;margin-bottom:8px}
.rem.pr-alta{border-left-color:var(--pr-alta)}
.rem.pr-baja{border-left-color:var(--pr-baja)}
.rem.done{opacity:.6}
.rem.done .rt{text-decoration:line-through}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;color:var(--on-accent);padding:0}
.rem.done .tick{background:var(--accent);border-color:var(--accent)}
.rbody{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 2px;display:flex;flex-direction:column}
.rt{font-weight:700}
.rm{font-size:.83rem;color:var(--muted)}
.rm.late{color:var(--danger);font-weight:700}
.bedtag{display:inline-block;font-size:.78rem;background:var(--band);color:var(--band-ink);padding:1px 7px;border-radius:6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.grp-h{font-size:.92rem;margin:16px 0 8px;color:var(--muted)}
.grp-h.late{color:var(--danger)}
.filters{display:flex;gap:8px;margin:6px 0 4px}
.filters select{flex:1;min-width:0}

/* Notas */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ngrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.ngrid{grid-template-columns:1fr 1fr}}
.ncard{text-align:left;border:1px solid var(--line);border-left:6px solid var(--nc,var(--accent));background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;width:100%}
.nt{font-weight:700}
.nx{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm{font-size:.78rem;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,15,18,.45)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet.full{max-width:820px;height:100%;max-height:100%;border-radius:0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}.sheet.full{max-height:96vh;height:96vh;border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sh-h h2{flex:1;margin:0;font-size:1.15rem}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:.88rem;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea,.filters select,.ed-meta select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:400;font-size:1rem}
.f textarea{resize:vertical;min-height:70px}
.f .hint{font-weight:400;font-size:.8rem}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:420px){.cols4{grid-template-columns:repeat(2,1fr)}}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 10px 0;margin:0 0 12px}
legend{font-size:.85rem;font-weight:700;color:var(--muted);padding:0 4px}
.sticky-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 4px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:6px}
.sticky-actions .btn{flex:1}
.prev{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:0 12px;margin-bottom:12px}
.prev summary{padding:12px 0;font-weight:700;cursor:pointer}
.prev .s{font-size:.88rem;white-space:pre-wrap;margin:0 0 8px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:14px}
.switch input,.wid input,.pick input{width:20px;height:20px;accent-color:var(--accent)}
.wid{display:flex;align-items:center;gap:10px;padding:6px 0}
.kc{display:flex;align-items:center;gap:10px;padding:4px 0}
.kc input{width:40px;height:32px;border:0;padding:0;background:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);font-size:1rem}
.menu button.danger{color:var(--danger)}
.set-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.set-sec h3{margin:0 0 8px;font-size:1rem}

/* Editor */
.ed-top{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.saved{font-size:.8rem;color:var(--muted)}
.ed-title{width:100%;border:0;background:none;font-size:1.5rem;font-weight:700;padding:6px 2px;outline:none;color:var(--ink)}
.ed-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ed-meta select{width:auto;padding:6px 10px;font-size:.9rem}
.sw{display:flex;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.toolbar{display:flex;gap:4px;overflow-x:auto;padding:6px;background:var(--sunk);border-radius:12px;position:sticky;top:0;z-index:2;margin-bottom:8px}
.toolbar button{flex:none;min-width:40px;height:38px;border:0;border-radius:8px;background:var(--surface);font-size:.95rem;padding:0 8px;color:var(--ink)}
.ed-body{min-height:50vh;outline:none;padding:6px 2px 80px;font-size:1.02rem;line-height:1.55}
.ed-body:empty::before{content:"Escribe aquí tus apuntes";color:var(--muted)}
.ed-body h2{font-size:1.3rem;margin:14px 0 6px}
.ed-body h3{font-size:1.1rem;margin:12px 0 4px}
.ed-body table{border-collapse:collapse;width:100%;margin:8px 0}
.ed-body td,.ed-body th{border:1px solid var(--line);padding:6px;min-width:60px}
ul.check{list-style:none;padding-left:4px}
ul.check li{position:relative;padding-left:30px;margin:4px 0}
ul.check li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;cursor:pointer}
ul.check li.done{color:var(--muted);text-decoration:line-through}
ul.check li.done::before{background:var(--accent);border-color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,460px);pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s ease-out}
#toast div.err{background:var(--danger);color:#fff}
.warn-bar{background:var(--danger);color:#fff;border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-size:.9rem}
.res-g h3{font-size:.95rem;margin:14px 0 6px;color:var(--muted)}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.res b{display:block}
.res span{font-size:.86rem;color:var(--muted)}
.spark{vertical-align:middle}
</style>

<body>
<div class="app">
  <header class="top" id="top"></header>
  <div id="warn"></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-a="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" aria-live="polite"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const KEY='mednotes:v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const today=()=>ymd(new Date());
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dt=(d,t)=>{const x=parseYmd(d);const[h,m]=(t||'00:00').split(':').map(Number);x.setHours(h||0,m||0,0,0);return x.getTime()};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtDate=s=>{const d=parseYmd(s);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const fmtShort=s=>{if(!s)return '';const d=parseYmd(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`};
const relDay=s=>{const k=diffDays(today(),s);return k===0?'Hoy':k===1?'Mañana':k===-1?'Ayer':fmtShort(s)};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const strip=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
const has=x=>x!=null&&String(x).trim()!=='';
const uniq=a=>[...new Set(a)];
const nl=s=>esc(s);

const I={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
bed:'<path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.5" r="1.8"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7M10 20a2 2 0 0 0 4 0"/>',
note:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',
check:'<path d="M5 12l5 5 9-10"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.7"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- catálogos ---------- */
const NOTE_CATS=['Cirugía','Medicina interna','Pediatría','Ginecología','Emergencias','Farmacología','Anatomía','Procedimientos','Apuntes personales'];
const NOTE_COLORS=['#0D6B67','#2D5DA8','#7A4BA8','#C2362B','#C08A12','#2F7D4A','#5A6B70'];
const REM_CATS=['Pendientes médicos','Laboratorios por revisar','Procedimientos','Interconsultas','Actividades académicas','Estudio personal','Medicamentos por revisar','Actividades personales','Otros'];
const PRIOS=[['alta','Alta'],['media','Media'],['baja','Baja']];
const PANELS=['Hemograma (biometría hemática)','Química sanguínea','Electrolitos','Función renal','Función hepática','Coagulación','Gasometría','Uroanálisis','Otros'];
const LAB_NAMES=['Leucocitos','Neutrófilos','Linfocitos','Hemoglobina','Hematocrito','Plaquetas','Glucosa','Urea','BUN','Creatinina','Sodio','Potasio','Cloro','Calcio','Magnesio','TGO (AST)','TGP (ALT)','Bilirrubina total','Fosfatasa alcalina','Albúmina','TP','TTP','INR','pH','pCO2','pO2','HCO3','Lactato','PCR','Procalcitonina'];
const VITALS=[['tas','TA sistólica','mmHg'],['tad','TA diastólica','mmHg'],['fc','FC','lpm'],['fr','FR','rpm'],['temp','Temperatura','°C'],['sat','SatO₂','%'],['eva','Dolor (EVA)','/10'],['gluc','Glucemia','mg/dL']];
const EVO_TEXT=[['full','Nota de evolución'],['s','Subjetivo'],['o','Objetivo'],['exam','Examen físico'],['results','Resultados relevantes'],['a','Análisis'],['plan','Plan'],['obs','Observaciones'],['rx','Prescripciones e indicaciones']];
const SHIFT_TYPES=['Guardia 24 h','Guardia nocturna','Guardia diurna','Fin de semana','Otro'];
const SHIFT_TEXT=[['news','Novedades'],['patients','Pacientes atendidos'],['procedures','Procedimientos'],['labsReq','Laboratorios solicitados'],['labsRes','Resultados recibidos'],['consults','Interconsultas'],['pending','Pendientes'],['obs','Observaciones']];
const PATTERNS=[['1-1','Cada 48 h (1 guardia, 1 libre)'],['1-2','Cada 72 h (1 guardia, 2 libres)'],['1-3','Cada 96 h (1 guardia, 3 libres)'],['2-1','2 días de guardia, 1 libre'],['custom','Personalizado o rotativo']];
const ROUTES=['VO','IV','IM','SC','Inhalada','Tópica','Sublingual','Otra'];
const PROC_TYPES=['Procedimiento','Curación','Estudio de imagen','Interconsulta'];
const WIDGETS=[['guardia','Próxima guardia'],['acciones','Accesos rápidos'],['pendientes','Pendientes del día'],['pacientes','Pacientes hospitalizados'],['libres','Próximos días libres'],['notas','Notas recientes']];

const defaults=()=>({
  v:1,rotations:[],patients:[],shifts:[],events:[],reminders:[],notes:[],dayNotes:{},overrides:{},
  cycle:{active:false,start:today(),pattern:'1-2',custom:'G L L',startTime:'07:00',endTime:'07:00',service:''},
  kinds:{
    guardia:{label:'Guardia',color:'#C2362B'},libre:{label:'Día libre',color:'#2F7D4A'},
    academica:{label:'Actividad académica',color:'#2D5DA8'},personal:{label:'Actividad personal',color:'#7A4BA8'},
    importante:{label:'Evento importante',color:'#C08A12'},vacaciones:{label:'Vacaciones o permiso',color:'#0E8A9A'}
  },
  conds:{estable:{label:'Estable',color:'#2D5DA8'},grave:{label:'Grave',color:'#C2362B'},observacion:{label:'Observación',color:'#E0B020'},fallecido:{label:'Fallecido',color:'#111111'},alta:{label:'Alta',color:'#FFFFFF'}},
  settings:{theme:'auto',hidden:[],openSections:{evo:true},noteCats:NOTE_CATS.slice(),guardAlert:12,guardNotified:''}
});

/* ---------- almacenamiento ---------- */
let storageOK=true;
try{localStorage.setItem('mn-test','1');localStorage.removeItem('mn-test')}catch(e){storageOK=false}
function merge(base,d){for(const k in d){if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))base[k]={...base[k],...d[k]};else base[k]=d[k]}return base}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return merge(defaults(),JSON.parse(raw))}catch(e){}return defaults()}
let S=load();
if(!Array.isArray(S.rotations))S.rotations=[];
if(S.cycle&&S.cycle.active&&!S.cycle.migrated&&!S.rotations.length){const c=S.cycle;S.rotations.push({id:uid(),name:c.service||'Mi rotación',start:c.start,end:'',first:c.start,pattern:c.pattern,custom:c.custom,startTime:c.startTime,endTime:c.endTime,color:'#C2362B',active:true});S.cycle.migrated=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){
  if(!storageOK)return false;
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){toast('No se pudo guardar en este dispositivo. Exporta una copia desde Ajustes.','err');return false}
}

const ui={tab:'inicio',patientId:null,patFilter:'todos',gView:'cal',calMode:'mes',calMonth:today().slice(0,7),weekStart:null,remCat:'',remPrio:'',noteCat:'',noteQ:'',showArchived:false,search:'',cmp:{},noteId:null,evoIdx:{},evoList:false};
const mondayOf=d=>addDays(d,-((parseYmd(d).getDay()+6)%7));
ui.weekStart=mondayOf(today());

const getP=id=>S.patients.find(p=>p.id===id);

/* ---------- ciclo y guardias ---------- */
function cycleSeq(r){
  r=r||{};
  if(r.pattern==='custom')return String(r.custom||'').toUpperCase().split(/[\s,\-]+/).filter(Boolean).map(x=>x==='G'||x==='T');
  const[a,b]=String(r.pattern||'1-1').split('-').map(Number);return [...Array(a||1).fill(true),...Array(b||0).fill(false)];
}
const ROT_COLORS=['#C2362B','#2D5DA8','#7A4BA8','#0E8A9A','#C08A12','#2F7D4A'];
const rotOn=d=>(S.rotations||[]).filter(r=>r.active!==false&&r.start&&d>=r.start&&(!r.end||d<=r.end)).sort((a,b)=>b.start.localeCompare(a.start))[0];
function rotGuard(r,d){const s=cycleSeq(r);if(!s.length)return false;const n=s.length;const k=diffDays(r.first||r.start,d);return s[((k%n)+n)%n]}
function cycleGuard(d){const r=rotOn(d);return r?rotGuard(r,d):false}
const guardEvents=d=>S.events.filter(e=>e.date===d&&e.kind==='guardia');
const isGuard=d=>guardEvents(d).length>0||(cycleGuard(d)&&S.overrides[d]!=='remove');
function guardTimes(d){
  const ev=guardEvents(d)[0];const r=rotOn(d)||{};
  const start=ev?.start||r.startTime||'07:00',end=ev?.end||r.endTime||'07:00';
  const sMs=dt(d,start);let eMs=dt(d,end);if(eMs<=sMs)eMs+=864e5;
  return {start,end,service:ev?.title||r.name||'',startMs:sMs,endMs:eMs};
}
function nextGuard(){
  const now=Date.now();
  for(let i=-1;i<400;i++){const d=addDays(today(),i);if(isGuard(d)){const g=guardTimes(d);if(g.endMs>now)return {date:d,...g}}}
  return null;
}
function lastGuard(){
  const now=Date.now();
  for(let i=0;i<400;i++){const d=addDays(today(),-i);if((isGuard(d)&&guardTimes(d).endMs<=now)||(i>0&&S.shifts.some(s=>s.date===d)))return d}
  return null;
}
function countdown(g){
  const ms=g.startMs-Date.now();
  if(ms<=0)return 'En guardia ahora';
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  if(d>0)return `Faltan ${d} ${d===1?'día':'días'}${h?` y ${h} h`:''}`;
  if(h>0)return `Faltan ${h} h ${m} min`;
  return `Faltan ${m} min`;
}

function searchResults(q){
  const n=norm(q),hit=s=>norm(s).includes(n);const G=[];
  const r1=S.notes.filter(x=>hit(x.title)||hit(strip(x.body)));
  if(r1.length)G.push(['Notas',r1.map(x=>`<button class="res" data-a="open-note" data-id="${x.id}"><b>${esc(x.title||'Sin título')}</b><span>${snippet(hit(x.title)?strip(x.body):strip(x.body),q)}</span></button>`)]);
  const r2=S.patients.filter(p=>[p.code,p.bed,p.service,p.dx,p.history,p.allergies,p.info,p.obs].some(hit));
  if(r2.length)G.push(['Pacientes y diagnósticos',r2.map(p=>`<button class="res" data-a="open-patient" data-id="${p.id}"><b>Cama ${esc(p.bed)}, ${esc(p.code)}</b><span>${snippet(p.dx,q)}</span></button>`)]);
  const r3=[];S.patients.forEach(p=>(p.evolutions||[]).forEach(e=>{const f=EVO_TEXT.find(([k])=>hit(e[k]));if(f)r3.push(`<button class="res" data-a="open-patient" data-id="${p.id}"><b>Cama ${esc(p.bed)}, ${esc(evoName(p,e))}</b><span>${f[1]}: ${snippet(e[f[0]],q)}</span></button>`)}));
  if(r3.length)G.push(['Evoluciones',r3]);
  const r4=[];S.patients.forEach(p=>(p.labs||[]).forEach(l=>{if(hit(l.name)||hit(l.panel))r4.push(`<button class="res" data-a="open-patient" data-id="${p.id}"><b>${esc(l.name)}: ${esc(l.value)} ${esc(l.unit)}</b><span>Cama ${esc(p.bed)}, ${fmtShort(l.date)}</span></button>`)}));
  if(r4.length)G.push(['Laboratorios',r4.slice(0,20)]);
  const r5=S.shifts.filter(s=>[s.service,s.type,...SHIFT_TEXT.map(([k])=>s[k])].some(hit));
  if(r5.length)G.push(['Guardias',r5.map(s=>{const f=SHIFT_TEXT.find(([k])=>hit(s[k]));return `<button class="res" data-a="open-shift" data-id="${s.id}"><b>${cap(fmtDate(s.date))}</b><span>${f?`${f[1]}: ${snippet(s[f[0]],q)}`:esc(s.service)}</span></button>`})]);
  const r6=S.reminders.filter(r=>hit(r.title)||hit(r.desc));
  if(r6.length)G.push(['Recordatorios',r6.map(remItem)]);
  const r7=[...S.events.filter(e=>hit(e.title)||hit(e.note)).map(e=>[e.date,e.title||S.kinds[e.kind]?.label]),...Object.entries(S.dayNotes).filter(([,v])=>hit(v)).map(([d,v])=>[d,v])];
  if(r7.length)G.push(['Calendario',r7.map(([d,t])=>`<button class="res" data-a="day" data-d="${d}"><b>${cap(fmtDate(d))}</b><span>${snippet(t,q)}</span></button>`)]);
  if(!G.length)return empty(`No hay resultados para «${esc(q)}».`);
  return G.map(([t,items])=>`<div class="res-g"><h3>${t}</h3>${items.join('')}</div>`).join('');
}

function deltaCell(prev,cur){
  if(!has(cur))return has(prev)?`<td class="d-gone">Sin registro</td>`:`<td class="muted">—</td>`;
  if(!has(prev))return `<td class="d-new">${esc(cur)}<small>Nuevo</small></td>`;
  const a=num(prev),b=num(cur);
  if(!isNaN(a)&&!isNaN(b)){
    if(b>a)return `<td class="d-up">${esc(cur)}<small>↑ ${fmtNum(b-a)}</small></td>`;
    if(b<a)return `<td class="d-down">${esc(cur)}<small>↓ ${fmtNum(a-b)}</small></td>`;
    return `<td>${esc(cur)}<small>= igual</small></td>`;
  }
  return String(prev).trim()===String(cur).trim()?`<td>${esc(cur)}<small>= igual</small></td>`:`<td class="d-chg">${esc(cur)}<small>Cambió</small></td>`;
}

function compareTable(p,ids){

function vGuardias(){return seg('gView',[['cal','Calendario'],['reg','Registros'],['ciclo','Rotaciones']],ui.gView)+(ui.gView==='cal'?vCal():ui.gView==='reg'?vShifts():vCycle())}
const klegend=()=>`<div class="klegend">${Object.entries(S.kinds).map(([k,v])=>`<span><i style="background:${esc(v.color)}"></i>${esc(v.label)}</span>`).join('')}<span><i style="background:var(--accent)"></i>Con registro</span><span><i style="background:var(--muted)"></i>Nota del día</span></div>`;
function vCal(){
  const mode=`<div class="mini-seg" role="tablist">${[['mes','Mes'],['semana','Semana']].map(([v,l])=>`<button role="tab" aria-selected="${ui.calMode===v}" data-a="seg" data-k="calMode" data-v="${v}">${l}</button>`).join('')}</div>`;
  const bar=s=>`<div class="cal-bar"><span class="stat">${s}</span><button class="btn small" data-a="cal-today">Hoy</button><button class="btn small primary" data-a="new-event">${ic('plus',16)} Evento</button></div>`;
  let o='';
  if(ui.calMode==='mes'){
    const[y,m]=ui.calMonth.split('-').map(Number);const first=`${y}-${pad(m)}-01`;const off=(parseYmd(first).getDay()+6)%7;const dim=new Date(y,m,0).getDate();const t0=today();
    let cells='',gc=0;
    for(let i=0;i<off;i++)cells+='<span class="day pad"></span>';
    for(let d=1;d<=dim;d++){
      const date=`${y}-${pad(m)}-${pad(d)}`;const g=isGuard(date);if(g)gc++;

      const dots=[...evs.slice(0,2).map(e=>`<i style="background:var(--k-${e.kind})"></i>`),S.shifts.some(s=>s.date===date)?'<i class="rc"></i>':'',S.dayNotes[date]?'<i class="nd"></i>':''].join('');

    }
    o+=`<div class="calcard"><div class="cal-head"><h2>${cap(MESES[m-1])} <span>${y}</span></h2>${mode}<button class="icon-btn sm" data-a="cal-move" data-n="-1" aria-label="Mes anterior">${ic('left',20)}</button><button class="icon-btn sm" data-a="cal-move" data-n="1" aria-label="Mes siguiente">${ic('right',20)}</button></div><div class="grid7">${['L','M','X','J','V','S','D'].map(x=>`<span class="wd">${x}</span>`).join('')}${cells}</div>${klegend()}</div>${bar(`<b>${gc}</b> ${gc===1?'guardia':'guardias'} en ${MESES[m-1]}`)}`;
  }else{
    const ws=ui.weekStart;let rows='';
    for(let i=0;i<7;i++){
      const d=addDays(ws,i);const g=isGuard(d);const t=g?guardTimes(d):null;const evs=S.events.filter(e=>e.date===d&&e.kind!=='guardia');const rs=S.reminders.filter(r=>r.date===d&&!r.done);
      rows+=`<button class="wrow${g?' g':''}${d===today()?' today':''}" data-a="day" data-d="${d}"><span class="wd2"><small>${cap(DIAS[parseYmd(d).getDay()].slice(0,3))}</small><b>${parseYmd(d).getDate()}</b></span><span style="flex:1;min-width:0;padding-top:4px">${g?`<div class="gt">Guardia ${t.start} a ${t.end}</div>`:'<div class="muted small">Libre</div>'}${evs.map(e=>`<div class="small"><span style="color:var(--k-${e.kind})">●</span> ${esc(e.title||S.kinds[e.kind]?.label)}${e.start?`, ${e.start}`:''}</div>`).join('')}${rs.length?`<div class="small muted">${rs.length} ${rs.length===1?'recordatorio':'recordatorios'}</div>`:''}${S.dayNotes[d]?`<div class="small muted">${esc(S.dayNotes[d].slice(0,60))}</div>`:''}</span></button>`;
    }
    o+=`<div class="calcard"><div class="cal-head"><h2>${fmtShort(ws)} <span>al ${fmtShort(addDays(ws,6))}</span></h2>${mode}<button class="icon-btn sm" data-a="week-move" data-n="-7" aria-label="Semana anterior">${ic('left',20)}</button><button class="icon-btn sm" data-a="week-move" data-n="7" aria-label="Semana siguiente">${ic('right',20)}</button></div>${rows}</div>${bar('')}`;
  }
  const ng=[];for(let i=0;i<180&&ng.length<4;i++){const d=addDays(today(),i);if(isGuard(d))ng.push(d)}
  if(ng.length)o+=`<div class="sec-h"><h2>Próximas guardias</h2></div><div class="nextg">${ng.map(d=>{const t=guardTimes(d);const k=diffDays(today(),d);const x=parseYmd(d);return `<button data-a="day" data-d="${d}"><span class="dd"><b>${x.getDate()}</b><small>${MESES[x.getMonth()].slice(0,3)}</small></span><span class="tx"><b>${cap(DIAS[x.getDay()])}</b><span>${t.start} a ${t.end}${t.service?`, ${esc(t.service)}`:''}</span></span><span class="in">${k===0?'Hoy':k===1?'Mañana':`En ${k} días`}</span></button>`}).join('')}</div>`;
  return o+`<button class="link" data-a="export-cal">Exportar este mes</button>`;
}

const rotInit=r=>String(r.name||'R').trim().split(/\s+/).filter(w=>w.length>2||/^[A-ZÁÉÍÓÚ]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'R';
function patLabel(r){if(r.pattern==='custom'){const s=cycleSeq(r);return `Personalizado: ${s.map(x=>x?'G':'L').join(' ')} (${s.length} días)`}const p=PATTERNS.find(([v])=>v===r.pattern);return p?p[1]:''}
function rotStatus(r){
  const t=today();
  if(r.active===false)return ['Desactivada',''];
  if(r.end&&r.end<t)return ['Rotación finalizada',''];
  if(r.start>t)return [`Empieza el ${fmtShort(r.start)}`,''];
  for(let i=0;i<400;i++){const d=addDays(t,i);if(r.end&&d>r.end)break;if(rotOn(d)===r&&rotGuard(r,d)&&S.overrides[d]!=='remove')return i===0?['Hoy de guardia','now']:[i===1?'Mañana':`En ${i} días`,'on']}
  return ['Sin guardias pendientes',''];
}
const yr=s=>s&&s.slice(0,4)!==today().slice(0,4)?` de ${s.slice(0,4)}`:'';

  const[st,cls]=rotStatus(r);const done=st==='Rotación finalizada'||st==='Desactivada';

function vCycle(){

  const list=[...S.rotations].sort((a,b)=>rank(a)-rank(b)||(b.start||'').localeCompare(a.start||''));
  return `<button class="btn primary wide" data-a="new-rot" style="margin-bottom:12px">${ic('plus',18)} Nueva rotación</button>

function vPend(){
  const t=today(),tm=addDays(t,1),wk=addDays(t,7),now=Date.now();
  const list=S.reminders.filter(r=>(!ui.remCat||r.cat===ui.remCat)&&(!ui.remPrio||r.prio===ui.remPrio)).sort((a,b)=>(a.date?remMs(a):9e15)-(b.date?remMs(b):9e15));

function advance(r){

}

let _db=null;
function idb(){if(_db)return _db;_db=new Promise((res,rej)=>{const r=indexedDB.open('mednotes-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>{_db=null;rej(r.error)}});return _db}
async function imgPut(id,data){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').put(data,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function imgGet(id){try{const db=await idb();return await new Promise(res=>{const r=db.transaction('imgs').objectStore('imgs').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}
async function imgDel(id){const db=await idb();return new Promise(res=>{const tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').delete(id);tx.oncomplete=()=>res()})}
async function imgAll(){const db=await idb();return new Promise(res=>{const out={};const r=db.transaction('imgs').objectStore('imgs').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>res(out)})}
function hydrateImgs(root){if(!root)return;root.querySelectorAll('img[data-img]').forEach(async im=>{if(im.getAttribute('src'))return;const v=await imgGet(im.dataset.img);if(v)im.src=v;else im.alt='Foto no disponible en este dispositivo'})}
async function shrink(file,max=1600,q=.8){
  const src=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {dataURL:c.toDataURL('image/jpeg',q),blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))};
}

function selectImg(im){hideImgBar();selImg=im;im.classList.add('sel');const cur=['sz-s','sz-m','sz-l'].find(c=>im.classList.contains(c))||'full';const bar=document.createElement('div');bar.id='imgBar';bar.className='imgbar';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Tamaño de la foto');bar.innerHTML=[['sz-s','Pequeña'],['sz-m','Mediana'],['sz-l','Grande'],['full','Completa']].map(([k,l])=>`<button data-a="img-size" data-s="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')+'<button data-a="img-del">Eliminar</button><button data-a="img-close" aria-label="Cerrar">✕</button>';document.body.appendChild(bar)}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function scanLocal(file,nid){
  showBusy('Leyendo el texto de la foto…','Se lee dentro de tu teléfono. La primera vez descarga el lector (necesita internet) y puede tardar un poco.',true);
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const{blob}=await shrink(file,2400,.9);
    const r=await window.Tesseract.recognize(blob,'spa');
    const t=String(r&&r.data&&r.data.text||'').trim();
    if(!t){toast('No se encontró texto en la foto.');return}
    insertInNote(`<p>${t.split('\n').map(esc).join('<br>')}</p><p><br></p>`,nid);
    toast('Texto escaneado. Revísalo con cuidado: el lector del teléfono comete más errores.');
  }catch(e){toast('No se pudo leer el texto. La primera vez necesitas internet; prueba también con una foto más nítida.','err')}
  finally{hideBusy()}
}
async function scanToNote(file){
  const nid=ui.noteId;
  const s=await getSample();
  if(!s){return scanLocal(file,nid)}
  const lim=await s.limits().catch(()=>null);
  if(!lim||!lim.images){toast('En esta vista no se pueden enviar fotos para leer texto.','err');return}
  let blob;try{blob=(await shrink(file,2000,.85)).blob}catch(e){toast('No se pudo abrir la imagen.','err');return}
  busyCtl=new AbortController();showBusy('Leyendo el texto de la foto…');
  try{
    const{text}=await s(SCAN_PROMPT,{images:[blob],signal:busyCtl.signal,cache:false});
    const t=String(text||'').trim();
    if(!t){toast('No se encontró texto en la foto.');return}
    insertInNote(`<p>${t.split('\n').map(esc).join('<br>')}</p><p><br></p>`,nid);
    toast('Texto escaneado. Revisa lo marcado con [?] o [ilegible].');
  }catch(e){
    const m={not_granted:'No diste permiso para usar Claude, así que no se pudo leer la foto.',rate_limited:'Hay demasiadas solicitudes seguidas. Espera un momento y vuelve a intentarlo.',image_rejected:'No se pudo leer esta imagen. Prueba con otra foto.',images_unavailable:'En esta vista no se pueden enviar fotos para leer texto.'};
    if(e&&e.code!=='cancelled')toast(m[e&&e.code]||'No se pudo leer el texto. Inténtalo de nuevo.','err');
  }finally{hideBusy();busyCtl=null}
}

function tick(){
  const now=Date.now();let ch=false,old=0;
  S.reminders.forEach(r=>{
    if(r.done||!r.date)return;const key=r.date+'T'+(r.time||'');if(r.notified===key)return;
    const when=dt(r.date,r.time||'08:00')-(Number(r.alert)||0)*6e4;
    if(now>=when){r.notified=key;ch=true;if(now-when>6*36e5){old++;return}const p=r.patientId&&getP(r.patientId);notify(r.title+(p?` – ${pTag(p)}`:''),r.time?`${relDay(r.date)}, ${r.time}`:'Para hoy')}
  });
  if(old)notify(`Tienes ${old} ${old===1?'recordatorio pendiente':'recordatorios pendientes'} de antes`);
  const ga=Number(S.settings.guardAlert)||0;
  if(ga){const g=nextGuard();if(g&&g.startMs>now&&g.startMs-now<=ga*36e5&&S.settings.guardNotified!==g.date){S.settings.guardNotified=g.date;ch=true;notify('Próxima guardia',`${cap(fmtDate(g.date))} a las ${g.start}`)}}
  if(ch)save();
  const cd=$('#cd');if(cd){const g=nextGuard();if(g)cd.textContent=countdown(g)}
  const b=document.querySelector('.tabs .badge');const pc=pendingCount();if((b?Number(b.textContent):0)!==pc&&!$('#sheetWrap').hidden===false)render();
}

/* ---------- formularios ---------- */
const SUB={
  patient:(d,f)=>{
    if(!d.code.trim())return toast('Escribe la cédula del paciente.','err');
    const dxList=[...f.querySelectorAll('.dxrow')].map(r=>({cie:r.querySelector('[name=dx_cie]').value.trim().toUpperCase(),text:r.querySelector('[name=dx_text]').value.trim()})).filter(x=>x.cie||x.text);
    const fields={code:d.code.trim(),bed:d.bed.trim(),service:d.service.trim(),admitDate:d.admitDate,status:d.cond==='alta'?'alta':d.status,cond:d.cond||'',dxList,dx:dxList.map(x=>x.text+(x.cie?` (${x.cie})`:'')).join('; '),history:d.history,allergies:d.allergies,info:d.info};
    let p=f.dataset.id&&getP(f.dataset.id);
    if(p)Object.assign(p,fields);else{p={id:uid(),...fields,evolutions:[],labs:[],meds:[],procs:[],obs:'',created:Date.now()};S.patients.push(p)}
    ui.tab='pacientes';ui.patientId=p.id;save();closeSheet();render();toast('Paciente guardado');
  },
  evo:(d,f)=>{
    const p=getP(f.dataset.pid);const vit={};VITALS.forEach(([k])=>{if(has(d['v_'+k]))vit[k]=d['v_'+k].trim()});
    const o={date:d.date,time:d.time,dayOverride:d.dayOverride,label:(d.label||'').trim(),vitals:vit};EVO_TEXT.forEach(([k])=>o[k]=d[k]);
    const ex={};Object.keys(d).forEach(k=>{if(!k.startsWith('ex__')||!has(d[k]))return;const[,r,pk,m]=k.split('__');ex[r]=ex[r]||{};ex[r][pk]=ex[r][pk]||{};ex[r][pk][m]=d[k].trim()});
    o.ex=ex;o.examOther=(d.examOther||'').trim();o.exam=composeExam(ex,o.examOther);
    const e=f.dataset.id&&p.evolutions.find(x=>x.id===f.dataset.id);
    const nid=e?e.id:uid();
    if(e)Object.assign(e,o);else p.evolutions.push({id:nid,...o});
    ui.evoIdx[p.id]=[...p.evolutions].sort(byEvo).findIndex(x=>x.id===nid);
    S.settings.openSections.evo=true;save();closeSheet();render();toast('Evolución guardada');
  },
  lab:(d,f,more)=>{
    const p=getP(f.dataset.pid);p.labs=p.labs||[];
    p.labs.push({id:uid(),panel:d.panel,name:d.name.trim(),value:d.value.trim(),unit:d.unit.trim(),ref:d.ref.trim(),date:d.date,time:d.time});
    S.settings.openSections.lab=true;save();render();
    if(more){labForm(p,{panel:d.panel,date:d.date,time:d.time});toast(`${d.name} guardado`);setTimeout(()=>$('#sheet [name="name"]')?.focus(),50)}else{closeSheet();toast('Resultado guardado')}
  },
  med:(d,f)=>{const p=getP(f.dataset.pid);p.meds=p.meds||[];p.meds.push({id:uid(),...d,active:true});S.settings.openSections.med=true;save();closeSheet();render()},
  proc:(d,f)=>{const p=getP(f.dataset.pid);p.procs=p.procs||[];p.procs.push({id:uid(),...d});S.settings.openSections.proc=true;save();closeSheet();render()},
  event:(d,f)=>{
    let e=f.dataset.id&&S.events.find(x=>x.id===f.dataset.id);
    if(e)Object.assign(e,d);else{e={id:uid(),...d};S.events.push(e)}
    if(e.kind==='guardia'&&S.overrides[e.date]==='remove')delete S.overrides[e.date];
    save();render();openDay(e.date);toast('Evento guardado');
  },
  shift:(d,f)=>{
    let s=f.dataset.id&&getShift(f.dataset.id);const wasNew=!s;
    if(s)Object.assign(s,d);else{s={id:uid(),...d,created:Date.now()};S.shifts.push(s)}
    let msg='Guardia guardada';
    if(!isGuard(s.date)){S.events.push({id:uid(),kind:'guardia',date:s.date,start:s.start,end:s.end,title:s.service,note:''});msg='Guardia guardada y marcada en el calendario'}
    save();closeSheet();if(wasNew&&ui.tab==='guardias')ui.gView='reg';render();toast(msg);
  },
  rot:(d,f)=>{
    if(!d.name.trim())return toast('Escribe el servicio de la rotación.','err');
    if(d.end&&d.end<d.start)return toast('La fecha de fin es anterior al inicio.','err');
    if(d.pattern==='custom'&&!/[GgTt]/.test(d.custom||''))return toast('La secuencia necesita al menos una G.','err');
    const o={name:d.name.trim(),start:d.start,end:d.end||'',first:d.first||d.start,pattern:d.pattern,custom:d.custom||'',startTime:d.startTime,endTime:d.endTime,color:d.color||ROT_COLORS[0],active:!!f.elements.active.checked};
    let r=f.dataset.id&&S.rotations.find(x=>x.id===f.dataset.id);
    if(r)Object.assign(r,o);else{r={id:uid(),...o};S.rotations.push(r)}
    const clash=S.rotations.find(x=>x!==r&&x.active!==false&&r.active&&x.start<=(r.end||'9999')&&r.start<=(x.end||'9999'));
    save();closeSheet();render();
    toast(clash?`Guardada. Se cruza con «${clash.name}»: en los días compartidos manda la que empieza después.`:'Rotación guardada. El calendario ya muestra sus guardias.');
  },
  cycle:(d,f)=>{
    if(d.pattern==='custom'&&!/[GgTt]/.test(d.custom||''))return toast('La secuencia personalizada necesita al menos una G.','err');
    S.cycle={active:!!f.elements.active.checked,start:d.start,pattern:d.pattern,custom:d.custom,startTime:d.startTime,endTime:d.endTime,service:d.service};
    save();render();toast(S.cycle.active?'Ciclo guardado. El calendario ya muestra tus guardias.':'Ciclo guardado y desactivado');
  },
  rem:(d,f)=>{
    if(!d.title.trim())return toast('Escribe qué hay que hacer.','err');
    const o={title:d.title.trim(),desc:d.desc,cat:d.cat,prio:d.prio,date:d.date,time:d.time,alert:Number(d.alert)||0,recur:d.recur,patientId:d.patientId,shiftId:d.shiftId,noteId:d.noteId};
    let r=f.dataset.id&&getRem(f.dataset.id);
    if(r){Object.assign(r,o);r.notified=''}else S.reminders.push({id:uid(),...o,done:false});
    save();closeSheet();render();toast('Recordatorio guardado');
  }
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el){const a=A[el.dataset.a];if(a){e.preventDefault();a(el.dataset,el)}return}
  const im=e.target.closest('#edBody img');if(im){if(!(getNote(ui.noteId)||{}).locked)selectImg(im);return}
  if(!e.target.closest('#imgBar'))hideImgBar();
  const li=e.target.closest('#edBody ul.check li');
  if(li&&!(getNote(ui.noteId)||{}).locked){const r=li.getBoundingClientRect();if(e.clientX-r.left<28){li.classList.toggle('done');noteDirty()}}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-cmd]');if(b)e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)execTool(b.dataset.cmd)});
document.addEventListener('submit',e=>{
  const f=e.target;const k=f.dataset.submit;if(!k||!SUB[k])return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f));SUB[k](d,f,e.submitter&&e.submitter.name==='more');
});
let autoT=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='gsearch'){ui.search=t.value;renderHome();return}
  if(t.id==='nsearch'){ui.noteQ=t.value;renderNotesList();return}
  if(t.name&&t.name.startsWith('ex__')){syncChips(t.name);return}
  if(t.name==='dx_cie'||t.name==='dx_text'){const row=t.closest('.dxrow');const ci=row.querySelector('[name=dx_cie]'),tx=row.querySelector('[name=dx_text]');if(t===ci){const m=CIE10.find(([c])=>c===ci.value.trim().toUpperCase());if(m&&!tx.value.trim())tx.value=m[1]}else{const m=CIE10.find(([,x])=>x===tx.value.trim());if(m&&!ci.value.trim())ci.value=m[0]}return}
  if(t.id==='edTitle'||t.closest?.('#edBody')){noteDirty();return}
  if(t.dataset.auto){clearTimeout(autoT);autoT=setTimeout(()=>{
    if(t.dataset.auto==='pobs'){const p=getP(t.dataset.id);if(p){p.obs=t.value;save()}}
    if(t.dataset.auto==='daynote'){if(t.value.trim())S.dayNotes[t.dataset.d]=t.value;else delete S.dayNotes[t.dataset.d];save()}
  },400)}
  if(t.name==='name'&&t.closest('form[data-submit="lab"]')){
    const u=t.form.elements.unit;const prev=S.patients.flatMap(p=>p.labs||[]).filter(l=>l.name.toLowerCase()===t.value.trim().toLowerCase()).pop();
    if(prev&&!u.value){u.value=prev.unit||'';if(prev.ref&&!t.form.elements.ref.value)t.form.elements.ref.value=prev.ref;t.form.elements.panel.value=prev.panel}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){ui[t.dataset.f]=t.value;render();return}
  if(t.dataset.f2==='archived'){ui.showArchived=t.checked;renderNotesList();return}
  if(t.dataset.cmp){const pid=t.dataset.cmp;ui.cmp[pid]=[...document.querySelectorAll(`[data-cmp="${pid}"]:checked`)].map(x=>x.value);$('#cmp-'+pid).innerHTML=compareTable(getP(pid),ui.cmp[pid]);return}
  if(t.dataset.cond){S.conds[t.dataset.cond].color=t.value;save();render();return}
  if(t.dataset.condl){if(t.value.trim()){S.conds[t.dataset.condl].label=t.value.trim();save();render()}return}
  if(t.dataset.kind){S.kinds[t.dataset.kind].color=t.value;save();applyTheme();return}
  if(t.dataset.widget){const h=S.settings.hidden;S.settings.hidden=t.checked?h.filter(x=>x!==t.dataset.widget):uniq([...h,t.dataset.widget]);save();render();return}
  if(t.dataset.setting){S.settings[t.dataset.setting]=Number(t.value);S.settings.guardNotified='';save();return}
  if(t.id==='edCat'){const n=getNote(ui.noteId);n.cat=t.value;save();return}
  if(t.id==='notePhoto'&&t.files[0]){insertPhoto(t.files[0]);t.value='';return}
  if(t.id==='noteScan'&&t.files[0]){scanToNote(t.files[0]);t.value='';return}
  if(t.name==='pattern'&&t.closest('form[data-submit="rot"]')){$('#customWrap').hidden=t.value!=='custom';return}
  if(t.name==='date'&&t.closest('form[data-submit="shift"]')){const f=t.form;$('#prevPanel').innerHTML=prevPanel(t.value,f.dataset.id);return}
  if(t.id==='importFile'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.patients)||!Array.isArray(d.notes))throw 0;
      askConfirm('¿Reemplazar los datos actuales por los de la copia?','Reemplazar',async()=>{const im=d.images||{};delete d.images;for(const k in im){try{await imgPut(k,im[k])}catch(e){}}S=merge(defaults(),d);save();ui.patientId=null;render();toast('Copia importada')})}catch(err){toast('El archivo no es una copia válida de MedNotes.','err')}};r.readAsText(t.files[0]);
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-sec]')){S.settings.openSections[d.dataset.sec]=d.open;save()}},true);
let sw=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest&&e.target.closest('[data-swipe]');sw=el?{pid:el.dataset.swipe,x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0];const dx=t.clientX-sw.x,dy=t.clientY-sw.y;const pid=sw.pid;sw=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)A['evo-nav']({pid,n:dx<0?1:-1})},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ui.noteId)flushNote()});
window.addEventListener('pagehide',()=>{if(ui.noteId)flushNote()});

render();
setTimeout(tick,1500);
setInterval(()=>{tick();if(ui.tab==='inicio'&&!ui.search&&$('#sheetWrap').hidden)renderHome()},30000);
getDL();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
